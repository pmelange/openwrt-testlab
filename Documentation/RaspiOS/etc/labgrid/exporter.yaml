{% set baselist = [578, 586, 594, 602, 610] %}
{% set devip =["10.248.248.1", "10.248.248.17", "10.248.248.33", 
               "10.248.248.49", "10.248.248.65", "10.248.248.81", 
               "10.248.248.97", "10.248.248.113", "10.248.248.129", 
               "10.248.248.145"] %}
{% for testdev in range(0, 10) %}
{% set devnum = "0" if testdev < 9 else "" %}
{% set devnum = devnum + (testdev + 1)|string %}
testdev{{devnum}}:
  location: "testdev{{devnum}}"
  RawSerialPort:
    port: "/dev/ttySC{{testdev}}"
  power:
    cls: "SysfsGPIO"
    index: {{ baselist[(testdev/2)|round(0, 'floor')|int] + (testdev%2)  }}
    invert: True
  reset:
    cls: "SysfsGPIO"
    index: {{ baselist[(testdev/2)|round(0, 'floor')|int] + (testdev%2) +2 }}
    invert: False
  NetworkInterface:
    ifname: "eth0.1{{devnum}}"
  NetworkService:
    address: {{ devip[testdev] }}
    username: root
  TFTPProvider:
    internal: "/srv/tftp/testdev{{devnum}}"
    external: "/srv/tftp/testdev{{devnum}}"
{% endfor %}
aux1:
  SysfsGPIO:
    index: {{ 512 + 25 }}
    invert: True
aux2:
  SysfsGPIO:
    index: {{ 512 + 26 }}
    invert: True
