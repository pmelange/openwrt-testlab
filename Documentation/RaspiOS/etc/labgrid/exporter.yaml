{% set baselist = [578, 586, 594, 602, 610] %}
{% set devip = ["192.168.101.1", "192.168.102.1", "192.168.103.1", 
                "192.168.104.1", "192.168.105.1", "192.168.106.1", 
                "192.168.107.1", "192.168.108.1", "192.168.109.1", 
                "192.168.110.1"] %}

{% for testdev in range(0, 10) %}
testdev{{0 if testdev < 9}}{{testdev + 1}}:
  location: "testdev{{0 if testdev < 9}}{{testdev + 1}}"
  RawSerialPort:
    port: "/dev/ttySC{{testdev}}"
  power:
    cls: "SysfsGPIO"
    index: {{ baselist[(testdev/2)|round(0, 'floor')|int] + (testdev%2)  }}
    invert: True
  reset:
    cls: "SysfsGPIO"
    index: {{ baselist[(testdev/2)|round(0, 'floor')|int] + (testdev%2) +2 }}
    invert: False
  NetworkInterface:
    ifname: "eth0.1{{0 if testdev < 9}}{{testdev + 1}}"
  NetworkService:
    address: {{ devip[testdev] }}
    username: root
{% endfor %}
aux1:
  SysfsGPIO:
    index: {{ 512 + 25 }}
    invert: True
aux2:
  SysfsGPIO:
    index: {{ 512 + 26 }}
    invert: True
