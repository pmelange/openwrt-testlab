#!/usr/sbin/nft -f

flush ruleset

# External Interfaces (uplink/management/mesh/other)
define EXT = {eth0.41, eth0.42, wlan0}

# Local Interfaces
define LOCAL = eth0*

table ip global {
	chain input {
		type filter hook input priority 0; policy drop;

		ct state established,related accept
		ct state invalid drop

		# allow connections
		iifname lo accept
		iifname $EXT accept
		iifname $LOCAL accept
	}
	chain forward {
		type filter hook forward priority 0; policy drop;

		ct state established,related accept
		ct state invalid drop

		iifname lo accept
		iifname $LOCAL accept
	}
}
table ip net {
	chain postrouting {
		type nat hook postrouting priority 100; policy accept;

		oifname $EXT masquerade
	}
}

