targets:
  main:
    features:
      - console
      - wifi
      - online
      - olsr
    resources:
      - RemotePlace:
          name: port8
    drivers:
      - GpioDigitalOutputDriver:
          name: powerdriver
          bindings:
            gpio: power # resouce name
      - GpioDigitalOutputDriver:
          name: resetdriver
          bindings:
            gpio: reset # resource name
      - DigitalOutputPowerDriver:
          bindings:
            output: powerdriver
      - DigitalOutputButtonDriver:
          delay: 7.0
          bindings:
            output: resetdriver
      - SerialDriver: {}
      - TFTPProviderDriver: {}
      - UBootInteractionBoot:
          commands:
            - atgo
      - UBootInteractionTftpboot:
          image: "initramfs"
          commands:
            - atnf $IMAGE
            - atna 192.168.0.108
            - atns "192.168.0.1; tftpboot"
            - atns "192.168.0.1; bootm"
      - UBootInteractionBootp:
          image: "initramfs"
          mac: "fa:26:d7:78:e2:6c"
          bootpip: "192.168.0.108"
          commands:
            - atns "192.168.0.1; bootp; bootm"
      - OpenWrtUBootDriver:
          prompt: '=>'
          boot_expression: 'stop autoboot'
          boot_secret: 'a'
          boot_secret_nolf: True
      - OpenWrtShellDriver:
          keyfile: "~/.ssh/id_rsa.pub"
      - OpenWrtUciDriver:
          config:
            - add:
                network: "bridge-vlan" # create unamed section
            - add:
                network: "bridge-vlan"
            - delete:
                network: "@device[1]"
            - set:
                network:
                  "@bridge-vlan[0]":
                    device: "br-switch0"
                    vlan: 1
                  "@bridge-vlan[1]":
                    device: "br-switch0"
                    vlan: 108
                  wan:
                    device: "br-switch0.1"
                  wan6:
                    device: "br-switch0.1"
                  "@device[0]":
                    name: "br-switch0"
                  lan:
                    device: "br-switch0.108"
                    ipaddr: '10.36.248.113'
                    netmask: '255.255.255.240'
            - add_list:
                network:
                  "@bridge-vlan[0]":
                    ports: "lan:u"
                  "@bridge-vlan[1]":
                    ports: "lan:t"
      - OpenWrtLuCIDriver: {}
      - FreifunkWizardDriver:
          address: "10.36.248.113"
          password: "abc123"
          network: "Freifunk Berlin"
          hostname: "testdev08"
          nickname: "testlabuser"
          realname: "openwrt-testlab"
          email: "email@address"
          location: "Panoramastrasse 1A, 10178 Berlin"
          lat: "52.52081970085464"
          lon: "13.409418231737128"
          alt: "368"
          sharedInternet: True
          bw_down: "60"
          bw_up: "20"
          stats: False
          meship_radio0: "10.36.251.113"
          meshmode_radio0: "80211a"
          meship_radio1: "10.36.251.114"
          meshmode_radio1: "80211s"
          ssid: "testdev08.berlin.freifunk.net"
          dhcp: "10.36.248.112/28"
      - SSHDriver:
          explicit_scp_mode: True
      - NetworkInterfaceDriver: {}
      - FalterStrategy: {}
paths:
  backup: !template "$BASE/backup"
images:
  # filenames including a prefix of "/srv/tftp/testdevXX/" must be 128 char or less
  initramfs: "firmware/openwrt-24.10.0-ramips-mt7621-zyxel_nwa50ax-initramfs-kernel.bin"
  sysupgrade: "firmware/freifunk-falter-1.4.0-ramips-mt7621-mwa50ax-squashfs-sysupgrade.bin"
  restore: "backup/restore.tar.gz"
imports:
  - ../../openwrt-testlab.py
  - ../../falter-testlab.py
