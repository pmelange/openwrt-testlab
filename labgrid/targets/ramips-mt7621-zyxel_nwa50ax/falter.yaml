targets:
  main:
    features:
      - falter
      - ramboot_then_flash
      - console
      - reset
      - wifi
      - online
      - olsr
    options:
      lan_ip: '10.248.248.113'
      lan_netmask: '255.255.255.240'
      lan_vlan: 108
      connected_port: 'lan'
    resources:
      - RemotePlace:
          name: port8
    drivers:
      - GpioDigitalOutputDriver:
          name: powerdriver
          bindings:
            gpio: power # resouce name
      - GpioDigitalOutputDriver:
          name: resetdriver
          bindings:
            gpio: reset # resource name
      - DigitalOutputPowerDriver:
          bindings:
            output: powerdriver
      - DigitalOutputButtonDriver:
          delay: 7.0
          bindings:
            output: resetdriver
      - SerialDriver: {}
      - TFTPProviderDriver: {}
      - UBootInteractionBoot:
          commands:
            - atgo
      - UBootInteractionRamboot:
          image: "rescue_ramboot"
          commands:
            - atnf $IMAGE
            - atna 192.168.0.108
            - atns "192.168.0.1; tftpboot"
            - atns "192.168.0.1; bootm"
      - OpenWrtUBootDriver:
          prompt: '=>'
          autoboot: 'stop autoboot'
          boot_secret: 'a'
          boot_secret_nolf: True
      - OpenWrtShellDriver:
          keyfile: "~/.ssh/id_rsa.pub"
      - OpenWrtUciDriver: {}
      - OpenWrtPackageDriver: {}
      - OpenWrtLuCIDriver: {}
      - FreifunkWizardDriver:
          address: "10.248.248.113"
          password: "abc123"
          network: "Freifunk Berlin"
          hostname: "testdev08"
          nickname: "testlabuser"
          realname: "openwrt-testlab"
          email: "email@address"
          location: "Panoramastrasse 1A, 10178 Berlin"
          lat: "52.52081970085464"
          lon: "13.409418231737128"
          alt: "368"
          sharedInternet: True
          bw_down: "60"
          bw_up: "20"
          stats: False
          meship_radio0: "10.248.251.112"
          meshmode_radio0: "80211s"
          meship_radio1: "10.248.251.113"
          meshmode_radio1: "80211s"
          ssid: "testdev08.berlin.freifunk.net"
          dhcp: "10.36.248.112/28"
      - SSHDriver:
          explicit_scp_mode: True
      - NetworkInterfaceDriver: {}
      - FalterStrategy: {}
paths:
  backup: !template "$BASE/backup"
images:
  # filenames including a prefix of "/srv/tftp/testdevXX/" must be 128 char or less
  target: !template $LG_IMAGE
  rescue_ramboot: "firmware/openwrt-24.10.3-ramips-mt7621-zyxel_nwa50ax-initramfs-kernel.bin"
imports:
  - ../../openwrt-testlab.py
  - ../../falter-testlab.py
