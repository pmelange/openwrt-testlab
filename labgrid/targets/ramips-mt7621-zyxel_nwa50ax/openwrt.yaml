targets:
  main:
    features:
      - console
      - wifi
      - online
      - olsr
    resources:
      - RemotePlace:
          name: port8
    drivers:
      - GpioDigitalOutputDriver:
          name: powerdriver
          bindings:
            gpio: power # resouce name
      - GpioDigitalOutputDriver:
          name: resetdriver
          bindings:
            gpio: reset # resource name
      - DigitalOutputPowerDriver:
          bindings:
            output: powerdriver
      - DigitalOutputButtonDriver:
          delay: 7.0
          bindings:
            output: resetdriver
      - SerialDriver: {}
      - TFTPProviderDriver: {}
      - UBootInteractionBoot:
          commands:
            - atgo
      - UBootInteractionFlash:
          image: "recovery"
          commands:
            - atnf $IMAGE
            - atna 192.168.0.108
            - atns 192.168.0.1
            - atnz
      - UBootInteractionTftpboot:
          image: "initramfs"
          commands:
            - atnf $IMAGE
            - atna 192.168.0.108
            - atns "192.168.0.1; tftpboot"
            - atns "192.168.0.1; bootm"
      - UBootInteractionBootp:
          image: "initramfs"
          mac: "fa:26:d7:78:e2:6c"
          bootpip: "192.168.0.108"
          commands:
            - atns "192.168.0.1; bootp; bootm"
      - OpenWrtUBootDriver:
          prompt: '=>'
          boot_expression: 'stop autoboot'
          boot_secret: 'a'
          boot_secret_nolf: True
      - OpenWrtShellDriver:
          keyfile: "~/.ssh/id_rsa.pub"
      - OpenWrtUciDriver:
          config:
            - add:
                network: "bridge-vlan" # create unamed section
            - add:
                network: "bridge-vlan"
            - set:
                network:
                  interface: "wan" # create named section "wan"
            - set:
                network:
                  interface: "wan6" # create named section "wan6"
            - set:
                system:
                  "@system[0]":
                    hostname: "testdev08"
                network:
                  "@bridge-vlan[0]":
                    device: "br-switch0"
                    vlan: 1
                  "@bridge-vlan[1]":
                    device: "br-switch0"
                    vlan: 108
                  wan:
                    device: "br-switch0.1"
                    proto: "dhcp"
                  wan6:
                    device: "br.switch0.1"
                    proto: "dhcp6"
                  "@device[0]":
                    name: "br-switch0"
                  lan:
                    device: "br-switch0.108"
                    ipaddr: '192.168.108.1'
            - add_list:
                network:
                  "@bridge-vlan[0]":
                    ports: "lan:u"
                  "@bridge-vlan[1]":
                    ports: "lan:t"
      - OpenWrtLuCIDriver: {}
      - SSHDriver:
          explicit_scp_mode: True
      - NetworkInterfaceDriver: {}
      - OpenWrtStrategy: {}
paths:
  backup: !template "$BASE/backup"
images:
  # filenames including a prefix of "/srv/tftp/testdevXX" must be 128 char or less
  initramfs: "firmware/openwrt-24.10.0-ramips-mt7621-zyxel_nwa50ax-initramfs-kernel.bin"
  recovery: "firmware/openwrt-24.10.0-ramips-mt7621-zyxel_nwa50ax-squashfs-sysupgrade.bin"
  sysupgrade: "firmware/openwrt-24.10.0-ramips-mt7621-zyxel_nwa50ax-squashfs-sysupgrade.bin"
  restore: "backup/restore.tar.gz"
imports:
  - ../../openwrt-testlab.py
