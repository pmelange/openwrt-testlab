targets:
  main:
    features:
      - bbbconfig
      - ramboot_then_flash
      - console
      - reset
      - wifi
      - online
      - olsr
    options:
      lan_ip: '10.248.248.113'
      lan_netmask: '255.255.255.240'
      lan_vlan: 108
      connected_port: 'lan'
    resources:
      - RemotePlace:
          name: port8
    drivers:
      - GpioDigitalOutputDriver:
          name: powerdriver
          bindings:
            gpio: power # resouce name
      - GpioDigitalOutputDriver:
          name: resetdriver
          bindings:
            gpio: reset # resource name
      - DigitalOutputPowerDriver:
          bindings:
            output: powerdriver
      - DigitalOutputButtonDriver:
          delay: 7.0
          bindings:
            output: resetdriver
      - SerialDriver: {}
      - TFTPProviderDriver: {}
      - UBootInteractionBoot:
          commands:
            - atgo
      - UBootInteractionRamboot:
          image: "target"
          mac: "fa:26:d7:78:e2:6c"
          bootpip: "192.168.0.108"
          commands:
            - atns "192.168.0.1; bootp; bootm"
      - OpenWrtUBootDriver:
          prompt: '=>'
          autoboot: 'stop autoboot'
          boot_secret: 'a'
          boot_secret_nolf: True
      - OpenWrtShellDriver:
          keyfile: "~/.ssh/id_rsa.pub"
      - OpenWrtUciDriver: {}
      - OpenWrtPackageDriver: {}
      - OpenWrtLuCIDriver: {}
      - SSHDriver:
          explicit_scp_mode: True
      - NetworkInterfaceDriver: {}
      - BBBConfigStrategy: {}
paths:
  backup: !template "$BASE/backup"
images:
  # filenames including a prefix of "/srv/tftp/testdevXX/" must be 128 char or less
  target: !template $LG_IMAGE
  rescue_ramboot: "firmware/openwrt-24.10.0-ramips-mt7621-zyxel_nwa50ax-initramfs-kernel.bin"
  factory: "firmware/freifunk-falter-1.4.0-ramips-mt7621-zyxel_nwa50ax-squashfs-factory.bin"
  sysupgrade: "firmware/freifunk-falter-1.4.0-ramips-mt7621-mwa50ax-squashfs-sysupgrade.bin"
  restore: "backup/restore.tar.gz"
imports:
  - ../../openwrt-testlab.py
  - ../../bbbconfig-testlab.py
