targets:
  main:
    features:
      - ramboot_then_flash
      - console
      - wifi
      - online
      - olsr
    options:
      hostname: 'testdev01'
      lan_ip: '10.248.248.1'
      lan_netmask: '255.255.255.240'
      lan_vlan: 101
      connected_port: wan
    resources:
      - RemotePlace:
          name: port1
    drivers:
      - GpioDigitalOutputDriver:
          name: powerdriver
          bindings:
            gpio: power # resouce name
      - GpioDigitalOutputDriver:
          name: resetdriver
          bindings:
            gpio: reset # resource name
      - DigitalOutputPowerDriver:
          bindings:
            output: powerdriver
      - DigitalOutputButtonDriver:
          delay: 7.0
          bindings:
            output: resetdriver
      - SerialDriver: {}
      - TFTPProviderDriver: {}
      - UBootInteractionBoot:
          commands:
            - mtkautoboot
      - UBootInteractionRamboot:
          image: "rescue_ramboot"
          mac: "ENV ethaddr"
          bootpip: "192.168.0.101"
          commands:
            - bootp
            - bootm
      - OpenWrtUBootDriver:
          prompt: 'MT7981>'
          boot_expression: 'RESET button is pressed'
          boot_secret: '\x03'
          boot_secret_nolf: True
          hold_reset_before_uboot: True
      - OpenWrtShellDriver:
          keyfile: "~/.ssh/id_rsa.pub"
      - OpenWrtUciDriver: {}
      - OpenWrtLuCIDriver: {}
      - SSHDriver:
          explicit_scp_mode: True
      - NetworkInterfaceDriver: {}
      - OpenWrtStrategy: {}
paths:
  backup: !template "$BASE/backup"
images:
  # filenames including a prefix of "/srv/tftp/testdevXX" must be 128 char or less
  target: !template $LG_IMAGE
  rescue_ramboot: "firmware/openwrt-24.10.2-mediatek-filogic-cudy_wr3000-v1-initramfs-kernel.bin"
  sysupgrade: "firmware/openwrt-24.10.2-mediatek-filogic-cudy_wr3000-v1-squashfs-sysupgrade.bin"
  restore: "backup/restore.tar.gz"
imports:
  - ../../openwrt-testlab.py
