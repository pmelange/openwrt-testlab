targets:
  main:
    features:
      - falter
      - ramboot_then_flash
      - console
      - reset
      - wifi
      - online
      - olsr
    options:
      lan_ip: '10.248.248.1'
      lan_netmask: '255.255.255.240'
      lan_vlan: 101
      connected_port: 'wan'
    resources:
      - RemotePlace:
          name: port1
    drivers:
      - GpioDigitalOutputDriver:
          name: powerdriver
          bindings:
            gpio: power # resouce name
      - GpioDigitalOutputDriver:
          name: resetdriver
          bindings:
            gpio: reset # resource name
      - DigitalOutputPowerDriver:
          bindings:
            output: powerdriver
      - DigitalOutputButtonDriver:
          delay: 7.0
          bindings:
            output: resetdriver
      - SerialDriver: {}
      - TFTPProviderDriver: {}
      - UBootInteractionBoot:
          commands:
            - mtkautoboot
      - UBootInteractionRamboot:
          image: "rescue_ramboot"
          commands:
            - setenv ipaddr 192.168.0.101
            - setenv serverip 192.168.0.1
            - tftpboot $IMAGE
            - bootm
      - OpenWrtUBootDriver:
          prompt: 'MT7981>'
          autoboot: 'RESET button is pressed'
          boot_secret: '\x03'
          boot_secret_nolf: True
          hold_reset_before_uboot: True
      - OpenWrtShellDriver:
          keyfile: "~/.ssh/id_rsa.pub"
      - OpenWrtUciDriver: {}
      - OpenWrtPackageDriver: {}
      - OpenWrtLuCIDriver: {}
      - FreifunkWizardDriver:
          address: "10.248.248.1"
          password: "abc123"
          network: "Freifunk Berlin"
          hostname: "testdev01"
          nickname: "testlabuser"
          realname: "openwrt-testlab"
          email: "email@address"
          location: "Panoramastrasse 1A, 10178 Berlin"
          lat: "52.52081970085464"
          lon: "13.409418231737128"
          alt: "368"
          sharedInternet: True
          bw_down: "60"
          bw_up: "20"
          stats: False
          meship_radio0: "10.248.251.0"
          meshmode_radio0: "80211s"
          meship_radio1: "10.248.251.1"
          meshmode_radio1: "80211s"
          ssid: "testdev01.berlin.freifunk.net"
          dhcp: "10.248.248.0/28"
      - SSHDriver:
          explicit_scp_mode: True
      - NetworkInterfaceDriver: {}
      - FalterStrategy: {}
paths:
  backup: !template "$BASE/backup"
images:
  # filenames including a prefix of "/srv/tftp/testdevXX/" must be 128 char or less
  target: !template $LG_IMAGE
  rescue_ramboot: "firmware/openwrt-24.10.2-mediatek-filogic-cudy_wr3000-v1-initramfs-kernel.bin"
imports:
  - ../../openwrt-testlab.py
  - ../../falter-testlab.py
