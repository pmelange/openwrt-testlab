targets:
  main:
    features:
      - console
      - wifi
      - online
      - olsr
    resources:
      - RemotePlace:
          name: port1
    drivers:
      - GpioDigitalOutputDriver:
          name: powerdriver
          bindings:
            gpio: power # resouce name
      - GpioDigitalOutputDriver:
          name: resetdriver
          bindings:
            gpio: reset # resource name
      - DigitalOutputPowerDriver:
          bindings:
            output: powerdriver
      - DigitalOutputButtonDriver:
          delay: 7.0
          bindings:
            output: resetdriver
      - SerialDriver: {}
      - TFTPProviderDriver: {}
      - UBootInteractionBoot:
          commands:
            - mtkautoboot
      - UBootInteractionTftpboot:
          image: "initramfs"
          commands:
            - setenv ipaddr 192.168.0.101
            - setenv serverip 192.168.0.1
            - tftpboot $IMAGE
            - bootm
      - UBootInteractionBootp:
          image: "initramfs"
          mac: "ENV ethaddr"
          bootpip: "192.168.0.101"
          commands:
            - bootp
            - bootm
      - OpenWrtUBootDriver:
          prompt: 'MT7981>'
          boot_expression: 'RESET button is pressed'
          boot_secret: '\x03'
          boot_secret_nolf: True
          hold_reset_before_uboot: True
      - OpenWrtShellDriver:
          keyfile: "~/.ssh/id_rsa.pub"
      - OpenWrtUciDriver:
          config:
            - set:
                network:
                  lan:
                    ipaddr: '10.248.248.1'
                    netmask: '255.255.255.240'
            - add_list:
                network:
                  "@device[0]":
                    ports: 'wan.101'
      - OpenWrtLuCIDriver: {}
      - FreifunkWizardDriver:
          address: "10.248.248.1"
          password: "abc123"
          network: "Freifunk Berlin"
          hostname: "testdev01"
          nickname: "testlabuser"
          realname: "openwrt-testlab"
          email: "email@address"
          location: "Panoramastrasse 1A, 10178 Berlin"
          lat: "52.52081970085464"
          lon: "13.409418231737128"
          alt: "368"
          sharedInternet: True
          bw_down: "60"
          bw_up: "20"
          stats: False
          meship_radio0: "10.248.251.0"
          meshmode_radio0: "80211a"
          meship_radio1: "10.248.251.1"
          meshmode_radio1: "80211s"
          ssid: "testdev01.berlin.freifunk.net"
          dhcp: "10.248.248.0/28"
      - SSHDriver:
          explicit_scp_mode: True
      - NetworkInterfaceDriver: {}
      - FalterStrategy: {}
paths:
  backup: !template "$BASE/backup"
images:
  # filenames including a prefix of "/srv/tftp/testdevXX/" must be 128 char or less
  initramfs: "firmware/openwrt-24.10.2-mediatek-filogic-cudy_wr3000-v1-initramfs-kernel.bin"
  sysupgrade: "firmware/freifunk-falter-1.4.0-mediatek-filogic-cudy_wr3000-v1-squashfs-sysupgrade.bin"
  restore: "backup/restore.tar.gz"
imports:
  - ../../openwrt-testlab.py
  - ../../falter-testlab.py
