targets:
  main:
    features:
      - console
      - wifi
      - online
      - olsr
    resources:
      - RemotePlace:
          name: port4
    drivers:
      - GpioDigitalOutputDriver:
          name: powerdriver
          bindings:
            gpio: power # resouce name
      - GpioDigitalOutputDriver:
          name: resetdriver
          bindings:
            gpio: reset # resource name
      - DigitalOutputPowerDriver:
          bindings:
            output: powerdriver
      - DigitalOutputButtonDriver:
          delay: 7.0
          bindings:
            output: resetdriver
      - SerialDriver: {}
      - TFTPProviderDriver: {}
      - UBootInteractionBoot:
          commands:
            - boot
      - UBootInteractionFlash:
          image: "recovery"
          commands:
            - setenv ipaddr 192.168.0.104
            - setenv serverip 192.168.0.1
            - tftpboot $IMAGE
            - nand erase 0x1c0000 0xd40000
            - nand write 0x80010000 0x1c0000 0xd40000
            - boot
      - UBootInteractionTftpboot:
          image: "factory"
          commands:
            - setenv ipaddr 192.168.0.104
            - setenv serverip 192.168.0.1
            - tftpboot $IMAGE
            - sf probe 0
            - sf erase 0x60000 0xf80000
            - sf write 0x1000000 0x60000 0xf80000
            - boot
      - UBootInteractionBootp:
          image: "initramfs"
          mac: "7e:87:3c:81:4f:61"
          bootpip: "192.168.0.104"
          commands:
            - bootp
            - bootm
      - OpenWrtUBootDriver:
          prompt: '=>'
          boot_expression: 'seconds'
          boot_secret: 'a'
          boot_secret_nolf: True
      - OpenWrtShellDriver:
          keyfile: "~/.ssh/id_rsa.pub"
      - OpenWrtUciDriver:
          config:
            - set:
                network:
                  interface: "wan"
            - set:
                network:
                  interface: "wan6"
            - set:
                system:
                  "@system[0]":
                    hostname: "testdev04"
                network:
                  lan:
                    ipaddr: '192.168.104.1'
                  wan:
                    proto: "dhcp"
                    device: "lan"
                  wan6:
                    proto: "dhcpv6"
                    device: "lan"
            - del_list:
                network:
                  "@device[0]":
                    ports: 'lan'
            - add_list:
                network:
                  "@device[0]":
                    ports: 'lan.104'
      - OpenWrtLuCIDriver: {}
      - SSHDriver:
          explicit_scp_mode: True
      - NetworkInterfaceDriver: {}
      - OpenWrtStrategy: {}
paths:
  backup: !template "$BASE/backup"
images:
  # filenames including a prefix of "/srv/tftp/testdevXX" must be 128 char or less
  factory: "firmware/openwrt-23.05-snapshot-r24145-db554fd450-freifunk-falter-1.4.0-mpc85xx-p1010-tplink_tl-wdr4900-v1-squashfs-factory.bin"
  sysupgrade: "firmware/openwrt-23.05-snapshot-r24145-db554fd450-freifunk-falter-1.4.0-mpc85xx-p1010-tplink_tl-wdr4900-v1-squashfs-sysupgrade.bin"
  restore: "backup/restore.tar.gz"
imports:
  - ../../openwrt-testlab.py
