targets:
  main:
    features:
      - console
      - wifi
      - online
      - olsr
    resources:
      - RemotePlace:
          name: port4
    drivers:
      - GpioDigitalOutputDriver:
          name: powerdriver
          bindings:
            gpio: power # resouce name
      - GpioDigitalOutputDriver:
          name: resetdriver
          bindings:
            gpio: reset # resource name
      - DigitalOutputPowerDriver:
          bindings:
            output: powerdriver
      - DigitalOutputButtonDriver:
          delay: 7.0
          bindings:
            output: resetdriver
      - SerialDriver: {}
      - TFTPProviderDriver: {}
      - MikrotikUBootInteractionBootp:
          image: "initramfs"
          mac: "dc:2c:6e:c3:fa:b9"
          bootpip: "192.168.0.104"
          cycle_power: True
          hold_reset: True
          hold_timeout: 20
      - OpenWrtUBootDriver:
          silent_uboot: True
      - OpenWrtShellDriver:
          keyfile: "~/.ssh/id_rsa.pub"
          login_timeout: 240
      - OpenWrtUciDriver:
          config:
            - set:
                network:
                  interface: "wan"
            - set:
                network:
                  interface: "wan6"
            - set:
                system:
                  "@system[0]":
                    hostname: "testdev04"
                network:
                  lan:
                    ipaddr: '192.168.104.1'
                  wan:
                    proto: "dhcp"
                    device: "lan"
                  wan6:
                    proto: "dhcpv6"
                    device: "lan"
            - del_list:
                network:
                  "@device[0]":
                    ports: 'lan'
            - add_list:
                network:
                  "@device[0]":
                    ports: 'lan.104'
      - OpenWrtLuCIDriver: {}
      - SSHDriver:
          explicit_scp_mode: True
      - NetworkInterfaceDriver: {}
      - OpenWrtStrategy: {}
paths:
  backup: !template "$BASE/backup"
images:
  # filenames including a prefix of "/srv/tftp/testdevXX" must be 128 char or less
  initramfs: "firmware/openwrt-24.10.2-ipq40xx-mikrotik-mikrotik_sxtsq-5-ac-initramfs-kernel.bin"
  sysupgrade: "firmware/openwrt-24.10.2-ipq40xx-mikrotik-mikrotik_sxtsq-5-ac-squashfs-sysupgrade.bin"
  restore: "backup/restore.tar.gz"
imports:
  - ../../openwrt-testlab.py
