targets:
  main:
    features:
      - falter
      - ramboot_then_flash
      - console
      - reset
      - wifi
      - online
      - olsr
    options:
      lan_ip: '10.248.248.49'
      lan_netmask: '255.255.255.240'
      lan_vlan: 104
      connected_port: lan
    resources:
      - RemotePlace:
          name: port4
    drivers:
      - GpioDigitalOutputDriver:
          name: powerdriver
          bindings:
            gpio: power # resouce name
      - GpioDigitalOutputDriver:
          name: resetdriver
          bindings:
            gpio: reset # resource name
      - DigitalOutputPowerDriver:
          bindings:
            output: powerdriver
      - DigitalOutputButtonDriver:
          delay: 7.0
          bindings:
            output: resetdriver
      - SerialDriver: {}
      - TFTPProviderDriver: {}
      - MikrotikUBootInteractionRamboot:
          image: "target"
          mac: "dc:2c:6e:c3:fa:b9"
          bootpip: "192.168.0.104"
          cycle_power: True
          hold_reset: True
          hold_timeout: 25
      - OpenWrtUBootDriver:
          prompt: 'IMPOSSIBLE' # we have a silent bootloader
          silent_uboot: True
          hold_reset_before_uboot: True
      - OpenWrtShellDriver:
          keyfile: "~/.ssh/id_rsa.pub"
          login_timeout: 240
      - OpenWrtUciDriver: {}
      - OpenWrtLuCIDriver: {}
      - FreifunkWizardDriver:
          address: "10.248.248.49"
          password: "abc123"
          network: "Freifunk Berlin"
          hostname: "testdev04"
          nickname: "testlabuser"
          realname: "openwrt-testlab"
          email: "email@address"
          location: "Panoramastrasse 1A, 10178 Berlin"
          lat: "52.52081970085464"
          lon: "13.409418231737128"
          alt: "368"
          sharedInternet: True
          bw_down: "60"
          bw_up: "20"
          stats: False
          meship_radio0: "10.248.251.48"
          meshmode_radio0: "80211s"
          # device has only 1 radio
          # meship_radio1: "10.248.251.49"
          # meshmode_radio1: "80211s"
          ssid: "testdev04.berlin.freifunk.net"
          dhcp: "10.248.248.48/28"
      - SSHDriver:
          explicit_scp_mode: True
      - NetworkInterfaceDriver: {}
      - FalterStrategy: {}
paths:
  backup: !template "$BASE/backup"
images:
  # filenames including a prefix of "/srv/tftp/testdevXX/" must be 128 char or less
  target: !template $LG_IMAGE
  rescue_ramboot: "firmware/openwrt-24.10.2-ipq40xx-mikrotik-mikrotik_sxtsq-5-ac-initramfs-kernel.bin"
  restore: "backup/restore.tar.gz"
imports:
  - ../../openwrt-testlab.py
  - ../../falter-testlab.py
