targets:
  main:
    features:
      - ramboot_then_flash
      - console
      - wifi
      - online
      - olsr
    options:
      lan_ip: '10.248.248.17'
      lan_netmask: '255.255.255.240'
      lan_vlan: 102
      connected_port: 'lan1'
    resources:
      - RemotePlace:
          name: port2
    drivers:
      - GpioDigitalOutputDriver:
          name: powerdriver
          bindings:
            gpio: power # resouce name
      - GpioDigitalOutputDriver:
          name: resetdriver
          bindings:
            gpio: reset # resource name
      - DigitalOutputPowerDriver:
          bindings:
            output: powerdriver
      - DigitalOutputButtonDriver:
          delay: 7.0
          bindings:
            output: resetdriver
      - SerialDriver: {}
      - TFTPProviderDriver: {}
      - UBootInteractionBoot:
          commands:
            - boot
      - UBootInteractionRamboot:
          image: "rescue_ramboot"
          sleep: 3
          mac: "44:4e:6d:af:9c:57"
          bootpip: "192.168.0.102"
          commands:
            - bootp
            - bootm
      - OpenWrtUBootDriver:
          prompt: '\(FRITZ7530\) #'
          boot_expression: 'stop autoboot'
          boot_secret: 'a'
          boot_secret_nolf: True
      - OpenWrtShellDriver:
          keyfile: "~/.ssh/id_rsa.pub"
      - OpenWrtUciDriver:
          config:
            - set:
                network:
                  wan:
                    proto: 'dhcp' # because of DSL modem
      - OpenWrtLuCIDriver: {}
      - FreifunkWizardDriver:
          address: "10.248.248.17"
          password: "abc123"
          network: "Freifunk Berlin"
          hostname: "testdev02"
          nickname: "testlabuser"
          realname: "openwrt-testlab"
          email: "email@address"
          location: "Panoramastrasse 1A, 10178 Berlin"
          lat: "52.52081970085464"
          lon: "13.409418231737128"
          alt: "368"
          sharedInternet: True
          bw_down: "60"
          bw_up: "20"
          stats: False
          meship_radio0: "10.248.251.16"
          meshmode_radio0: "80211s"
          meship_radio1: "10.248.251.17"
          meshmode_radio1: "80211s"
          ssid: "testdev02.berlin.freifunk.net"
          dhcp: "10.248.248.16/28"
      - SSHDriver:
          explicit_scp_mode: True
      - NetworkInterfaceDriver: {}
      - FalterStrategy: {}
paths:
  backup: !template "$BASE/backup"
images:
  # filenames including a prefix of "/srv/tftp/testdevXX/" must be 128 char or less
  target: !template $LG_IMAGE
  rescue_ramboot: "firmware/openwrt-24.10.2-ipq40xx-generic-avm_fritzbox-7530-initramfs-uImage.itb"
  sysupgrade: "firmware/freifunk-falter-1.4.0-ipq40xx-generic-avm_fritzbox-7530-squashfs-sysupgrade.bin"
  restore: "backup/restore.tar.gz"
imports:
  - ../../openwrt-testlab.py
  - ../../falter-testlab.py
