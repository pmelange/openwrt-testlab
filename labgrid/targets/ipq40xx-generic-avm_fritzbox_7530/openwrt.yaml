targets:
  main:
    features:
      - ramboot_then_flash
      - ramboot
      - dsl_modem
      - console
      - reset
      - wifi
      - online
    options:
      hostname: 'testdev02'
      lan_ip: '10.248.248.17'
      lan_netmask: '255.255.255.240'
      lan_vlan: 102
      connected_port: 'lan1'
      switch_ports: '0 1 2 3 4'
      switch_connected_port: '1'
      switch_cpuport: '0'
    resources:
      - RemotePlace:
          name: port2
    drivers:
      - GpioDigitalOutputDriver:
          name: powerdriver
          bindings:
            gpio: power # resouce name
      - GpioDigitalOutputDriver:
          name: resetdriver
          bindings:
            gpio: reset # resource name
      - DigitalOutputPowerDriver:
          bindings:
            output: powerdriver
      - DigitalOutputButtonDriver:
          delay: 7.0
          bindings:
            output: resetdriver
      - SerialDriver: {}
      - TFTPProviderDriver: {}
      - UBootInteractionBoot:
          commands:
            - run fritzboot
      - UBootInteractionRamboot:
          image: "target"
          mac: "44:4e:6d:af:9c:57"
          bootpip: "192.168.0.102"
          sleep: 3
          commands:
            - bootp
            - bootm
      - OpenWrtUBootDriver:
          prompt: '\(FRITZ7530\) #'
          autoboot: 'stop autoboot'
          boot_secret: 'a'
          boot_secret_nolf: True
      - OpenWrtShellDriver:
          keyfile: "~/.ssh/id_rsa.pub"
      - OpenWrtUciDriver:
          config:
            - set:
                network:
                  wan:
                    proto: "dhcp" # because of DSL modem
      - OpenWrtPackageDriver: {}
      - OpenWrtLuCIDriver: {}
      - SSHDriver:
          explicit_scp_mode: True
      - NetworkInterfaceDriver: {}
      - OpenWrtStrategy: {}
paths:
  backup: !template "$BASE/backup"
images:
  # filenames including a prefix of "/srv/tftp/testdevXX" must be 128 char or less
  target: !template $LG_IMAGE
  rescue_ramboot: "firmware/openwrt-24.10.2-ipq40xx-generic-avm_fritzbox-7530-initramfs-uImage.itb"
  restore: "backup/restore.tar.gz"
imports:
  - ../../openwrt-testlab.py
