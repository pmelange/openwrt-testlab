targets:
  main:
    features:
      - console
      - wifi
      - online
      - olsr
    options:
      hostname: 'testdev06'
      lan_ip: '192.168.106.1'
      lan_netmask: '255.255.55.0'
      lan_vlan: 106
      connected_port: 'wan'
    resources:
      - RemotePlace:
          name: port6
    drivers:
      - GpioDigitalOutputDriver:
          name: powerdriver
          bindings:
            gpio: power # resouce name
      - GpioDigitalOutputDriver:
          name: resetdriver
          bindings:
            gpio: reset # resource name
      - DigitalOutputPowerDriver:
          bindings:
            output: powerdriver
      - DigitalOutputButtonDriver:
          delay: 7.0
          bindings:
            output: resetdriver
      - SerialDriver: {}
      - TFTPProviderDriver: {}
      - UBootInteractionBoot:
          commands:
            - boot
      - UBootInteractionTftpboot:
          image: "initramfs"
          commands:
            - net_init
            - setenv ipaddr 192.168.0.6
            - setenv serverip 192.168.0.1
            - tftpboot $IMAGE
            - bootm
      - UBootInteractionBootp:
          image: "initramfs"
          mac: "44:d4:37:8c:13:78"
          bootpip: "192.168.0.6"
          commands:
            - net_init
            - bootp
            - bootm
      - OpenWrtUBootDriver:
          prompt: '->'
          boot_expression: 'stop autoboot'
          boot_secret: 'a'
          boot_secret_nolf: True
      - OpenWrtShellDriver:
          keyfile: "~/.ssh/id_rsa.pub"
      - OpenWrtUciDriver: {}
      - OpenWrtLuCIDriver: {}
      - SSHDriver:
          explicit_scp_mode: True
      - NetworkInterfaceDriver: {}
      - OpenWrtStrategy: {}
paths:
  backup: !template "$BASE/backup"
images:
  # filenames including a prefix of "/srv/tftp/testdevXX" must be 128 char or less
  initramfs: "firmware/openwrt-24.10.3-ramips-mt7621-genexis_pulse-ex400-initramfs-kernel.bin"
  factory: "firmware/openwrt-24.10.3-ramips-mt7621-genexis_pulse-ex400-factory.bin"
  sysupgrade: "firmware/openwrt-24.10.3-ramips-mt7621-genexis_pulse-ex400-sysupgrade.bin"
  restore: "backup/restore.tar.gz"
imports:
  - ../../openwrt-testlab.py
