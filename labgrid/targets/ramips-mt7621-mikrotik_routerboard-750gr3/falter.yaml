targets:
  main:
    features:
      - falter
      - ramboot_then_flash
      - console
      - reset
      - wifi
      - online
      - olsr
    options:
      lan_ip: '10.248.248.129'
      lan_netmask: '255.255.255.240'
      lan_vlan: 109
      connected_port: 'wan'
    resources:
      - RemotePlace:
          name: port9
    drivers:
      - GpioDigitalOutputDriver:
          name: powerdriver
          bindings:
            gpio: power # resouce name
      - GpioDigitalOutputDriver:
          name: resetdriver
          bindings:
            gpio: reset # resource name
      - DigitalOutputPowerDriver:
          bindings:
            output: powerdriver
      - DigitalOutputButtonDriver:
          delay: 7.0
          bindings:
            output: resetdriver
      - SerialDriver: {}
      - TFTPProviderDriver: {}
      - MikrotikUBootInteractionRamboot:
          image: "target"
          mac: "b8:69:f4:9c:41:4c"
          bootpip: "192.168.0.109"
          cycle_power: True
          hold_reset: True
          hold_timeout: 20
      - OpenWrtUBootDriver:
          prompt: 'IMPOSSIBLE'  # we have a silent bootloader
          silent_uboot: True
          hold_reset_before_uboot: True
      - OpenWrtShellDriver:
          keyfile: "~/.ssh/id_rsa.pub"
      - OpenWrtUciDriver: {}
      - OpenWrtPackageDriver: {}
      - OpenWrtLuCIDriver: {}
      - FreifunkWizardDriver:
          address: "10.248.248.129"
          password: "abc123"
          network: "Freifunk Berlin"
          hostname: "testdev09"
          nickname: "testlabuser"
          realname: "openwrt-testlab"
          email: "email@address"
          location: "Panoramastrasse 1A, 10178 Berlin"
          lat: "52.52081970085464"
          lon: "13.409418231737128"
          alt: "368"
          sharedInternet: True
          bw_down: "60"
          bw_up: "20"
          stats: False
          # This device does not have any radios
          # meship_radio0: "10.248.251.128"
          # meshmode_radio0: "80211s"
          # meship_radio1: "10.248.251.129"
          # meshmode_radio1: "80211s"
          ssid: "testdev09.berlin.freifunk.net"
          dhcp: "10.248.248.128/28"
      - SSHDriver:
          explicit_scp_mode: True
      - NetworkInterfaceDriver: {}
      - FalterStrategy: {}
paths:
  backup: !template "$BASE/backup"
images:
  # filenames including a prefix of "/srv/tftp/testdevXX/" must be 128 char or less
  target: !template $LG_IMAGE
  rescue_ramboot: "firmware/openwrt-23.05.0-rc3-ramips-mt7621-mikrotik_routerboard-750gr3-initramfs-kernel.bin"
  sysupgrade: "firmware/freifunk-falter-1.4.0-ramips-mt7621-mikrotik_routerboard-750gr3-squashfs-sysupgrade.bin"
  restore: "backup/restore.tar.gz"
imports:
  - ../../openwrt-testlab.py
  - ../../falter-testlab.py
