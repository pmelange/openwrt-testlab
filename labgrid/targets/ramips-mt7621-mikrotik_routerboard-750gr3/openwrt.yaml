targets:
  main:
    features:
      - console
      - wifi
      - online
      - olsr
    resources:
      - RemotePlace:
          name: port4
    drivers:
      - GpioDigitalOutputDriver:
          name: powerdriver
          bindings:
            gpio: power # resouce name
      - GpioDigitalOutputDriver:
          name: resetdriver
          bindings:
            gpio: reset # resource name
      - DigitalOutputPowerDriver:
          bindings:
            output: powerdriver
      - DigitalOutputButtonDriver:
          delay: 7.0
          bindings:
            output: resetdriver
      - SerialDriver: {}
      - TFTPProviderDriver: {}
      - UBootInteractionBootp:
          image: "initramfs"
          mac: "a2:db:82:64:59:fd"
          bootpip: "192.168.0.104"
          commands:
            - bootp
            - bootm
      - OpenWrtUBootDriver:
          prompt: '=>'
          boot_expression: 'stop autoboot'
          boot_secret: 'a'
          boot_secret_nolf: True
      - OpenWrtShellDriver:
          keyfile: "~/.ssh/id_rsa.pub"
      - OpenWrtUciDriver:
          config:
            - set:
                system:
                  "@system[0]":
                    hostname: "testdev04"
                network:
                  lan:
                    ipaddr: '192.168.104.1'
                  wan:
                    device: 'lan2'
                  wan6:
                    device: 'lan2'
            - del_list:
                network:
                  "@device[0]":
                    ports: 'lan2'
            - add_list:
                network:
                  "@device[0]":
                    ports: ['lan2.104', 'wan']
      - OpenWrtLuCIDriver: {}
      - SSHDriver:
          explicit_scp_mode: True
      - NetworkInterfaceDriver: {}
      - OpenWrtStrategy: {}
paths:
  backup: !template "$BASE/backup"
images:
  # filenames including a prefix of "/srv/tftp/testdevXX" must be 128 char or less
  initramfs: "firmware/openwrt-24.10.0-ramips-mt7621-dlink_covr-x1860-a1-initramfs-kernel.bin"
  recovery: "firmware/openwrt-24.10.0-ramips-mt7621-dlink_covr-x1860-a1-squashfs-recovery.bin"
  sysupgrade: "firmware/openwrt-23.05-snapshot-r24145-db554fd450-freifunk-falter-1.4.0-ramips-mt7621-dlink_covr-x1860-a1-squashfs-sysupgrade.bin"
  restore: "backup/restore.tar.gz"
imports:
  - ../../openwrt-testlab.py
