targets:
  main:
    features:
      - console
      - wifi
      - online
      - olsr
    resources:
      - RemotePlace:
          name: port9
    drivers:
      - GpioDigitalOutputDriver:
          name: powerdriver
          bindings:
            gpio: power # resouce name
      - GpioDigitalOutputDriver:
          name: resetdriver
          bindings:
            gpio: reset # resource name
      - DigitalOutputPowerDriver:
          bindings:
            output: powerdriver
      - DigitalOutputButtonDriver:
          delay: 7.0
          bindings:
            output: resetdriver
      - SerialDriver: {}
      - TFTPProviderDriver: {}
      - MikrotikUBootInteractionBootp:
          image: "initramfs"
          mac: "b8:69:f4:9c:41:4c"
          bootpip: "192.168.0.109"
          cycle_power: True
          hold_reset: True
          hold_timeout: 20
      - OpenWrtUBootDriver:
          prompt: 'IMPOSSIBLE'  # we have a silent bootloader
          silent_uboot: True
          hold_reset_before_uboot: True
      - OpenWrtShellDriver:
          keyfile: "~/.ssh/id_rsa.pub"
      - OpenWrtUciDriver:
          config:
            - set:
                system:
                  "@system[0]":
                    hostname: "testdev09"
                network:
                  lan:
                    ipaddr: '192.168.109.1'
            - add_list:
                network:
                  "@device[0]":
                    ports: 'wan.109'
      - OpenWrtLuCIDriver: {}
      - SSHDriver:
          explicit_scp_mode: True
      - NetworkInterfaceDriver: {}
      - OpenWrtStrategy: {}
paths:
  backup: !template "$BASE/backup"
images:
  # filenames including a prefix of "/srv/tftp/testdevXX" must be 128 char or less
  initramfs: "firmware/openwrt-23.05.0-rc3-ramips-mt7621-mikrotik_routerboard-750gr3-initramfs-kernel.bin"
  sysupgrade: "firmware/openwrt-24.10.3-ramips-mt7621-mikrotik_routerboard-750gr3-squashfs-sysupgrade.bin"
  restore: "backup/restore.tar.gz"
imports:
  - ../../openwrt-testlab.py
