targets:
  main:
    features:
      - bbbconfig
      - ramboot_then_flash
      - console
      - reset
      - wifi
      - namespace_online
      - olsr
    options:
      lan_ip: '10.248.248.97'
      lan_netmask: '255.255.255.240'
      lan_vlan: 107
      connected_port: 'eth0'
    resources:
      - RemotePlace:
          name: port7
    drivers:
      - GpioDigitalOutputDriver:
          name: powerdriver
          bindings:
            gpio: power # resouce name
      - GpioDigitalOutputDriver:
          name: resetdriver
          bindings:
            gpio: reset # resource name
      - DigitalOutputPowerDriver:
          bindings:
            output: powerdriver
      - DigitalOutputButtonDriver:
          delay: 7.0
          bindings:
            output: resetdriver
      - SerialDriver: {}
      - TFTPProviderDriver: {}
      - UBootInteractionRamboot:
          image: "rescue_ramboot"
          commands:
            - setenv autostart no
            - setenv ipaddr 192.168.0.107
            - setenv serverip 192.168.0.1
            - tftpboot $IMAGE
      - OpenWrtUBootDriver:
          prompt: 'apboot>'
          autoboot: 'stop autoboot'
          boot_secret: '\x03'
      - OpenWrtShellDriver:
          keyfile: "~/.ssh/id_rsa.pub"
      - OpenWrtUciDriver: {}
      - OpenWrtPackageDriver: {}
      - OpenWrtLuCIDriver: {}
      - SSHDriver:
          explicit_scp_mode: True
      - NetworkInterfaceDriver: {}
      - BBBConfigStrategy: {}
paths:
  backup: !template "$BASE/backup"
images:
  # filenames including a prefix of "/srv/tftp/testdevXX" must be 128 char or less
  target: !template $LG_IMAGE
  rescue_ramboot: "firmware/openwrt-ipq806x-generic-aruba_ap-32x-initramfs.ari"
imports:
  - ../../openwrt-testlab.py
  - ../../bbbconfig-testlab.py
