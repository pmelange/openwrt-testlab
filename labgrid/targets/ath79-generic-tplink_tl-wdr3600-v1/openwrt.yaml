targets:
  main:
    features:
      - uboot_flash
      - uboot_ramboot
      - swconfig
      - console
      - wifi
      - online
    options:
      hostname: 'testdev10'
      lan_ip: '192.168.110.1'
      lan_netmask: '255.255.255.0'
      lan_vlan: 110
      ports: '0 1 2 3 4 5'
      connected_port: 2
      cpuport: 0
    resources:
      - RemotePlace:
          name: port10
    drivers:
      - GpioDigitalOutputDriver:
          name: powerdriver
          bindings:
            gpio: power # resouce name
      - GpioDigitalOutputDriver:
          name: resetdriver
          bindings:
            gpio: reset # resource name
      - DigitalOutputPowerDriver:
          bindings:
            output: powerdriver
      - DigitalOutputButtonDriver:
          delay: 7.0
          bindings:
            output: resetdriver
      - SerialDriver: {}
      - TFTPProviderDriver: {}
      - UBootInteractionBoot:
          commands:
            - boot
      - UBootInteractionFlash:
          image: "sysupgrade"
          sleep: 3
          commands:
            - setenv ipaddr 192.168.0.110
            - setenv serverip 192.168.0.1
            - tftpboot 0x80060000 $IMAGE
            - erase 0x9f020000 +7c0000
            - cp.b 0x80060000 0x9f020000 0x7c0000
            - reset
      - UBootInteractionTftpboot:
          image: 'initramfs'
          sleep: 3
          commands:
            - setenv ipaddr 192.168.0.110
            - setenv serverip 192.168.0.1
            - tftp 0x82000000 $IMAGE
            - bootm
      - OpenWrtUBootDriver:
          prompt: 'db12x>'
          boot_expression: 'Autobooting in'
          boot_secret: 'tpl'
          boot_secret_nolf: True
      - OpenWrtShellDriver:
          keyfile: "~/.ssh/id_rsa.pub"
          ubus_ready_timeout: 120
      - OpenWrtUciDriver: {}
        #          config:
        #            - set:
        #                system:
        #                  "@system[0]":
        #                    hostname: "testdev10"
        #                network:
        #                  lan:
        #                    ipaddr: '192.168.110.1'
        #                  "@switch_vlan[0]":
        #                    vlan: 110
        #                    ports: '1 2t 3 4 5 0t'
        #                    vid: 110
        #                  "@switch_vlan[1]":
        #                    ports: '2 0t'
        #            - del_list:
        #                network:
        #                  "@device[0]": 
        #                    ports: 'eth0.1'
        #            - add_list:
        #                network:
        #                  "@device[0]": 
        #                    ports: 'eth0.110'
      - OpenWrtLuCIDriver: {}
      - SSHDriver:
          explicit_scp_mode: True
      - NetworkInterfaceDriver: {}
      - OpenWrtStrategy: {}
paths:
  backup: !template "$BASE/backup"
images:
  # filenames including a prefix of "/srv/tftp/testdevXX" must be 128 char or less
  initramfs: "firmware/openwrt-24.10.3-ath79-generic-tplink_tl-wdr3600-v1-initramfs-kernel.bin"
  factory: "firmware/openwrt-24.10.3-ath79-generic-tplink_tl-wdr3600-v1-squashfs-factory.bin"
  sysupgrade: "firmware/openwrt-24.10.3-ath79-generic-tplink_tl-wdr3600-v1-squashfs-sysupgrade.bin"
  restore: "backup/restore.tar.gz"
imports:
  - ../../openwrt-testlab.py
