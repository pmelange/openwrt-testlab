targets:
  main:
    features:
      - falter
      - flash
      - console
      - reset
      - wifi
      - online
      - olsr
    options:
      lan_ip: '10.248.248.145'
      lan_netmask: '255.255.255.240'
      lan_vlan: 110
      switch_ports: '0 1 2 3 4 5'
      switch_connected_port: '2'
      switch_cpuport: '0'
    resources:
      - RemotePlace:
          name: port10
    drivers:
      - GpioDigitalOutputDriver:
          name: powerdriver
          bindings:
            gpio: power # resouce name
      - GpioDigitalOutputDriver:
          name: resetdriver
          bindings:
            gpio: reset # resource name
      - DigitalOutputPowerDriver:
          bindings:
            output: powerdriver
      - DigitalOutputButtonDriver:
          delay: 7.0
          bindings:
            output: resetdriver
      - SerialDriver: {}
      - TFTPProviderDriver: {}
      - UBootInteractionBoot:
          commands:
            - boot
      - UBootInteractionFlash:
          image: "target"
          sleep: 3
          commands:
            - setenv ipaddr 192.168.0.110
            - setenv serverip 192.168.0.1
            - tftpboot 0x80060000 $IMAGE
            - erase 0x9f020000 +7c0000
            - cp.b 0x80060000 0x9f020000 0x7c0000
            - reset
      - OpenWrtUBootDriver:
          prompt: 'db12x>'
          autoboot: 'Autobooting in'
          boot_secret: 'tpl'
          boot_secret_nolf: True
      - OpenWrtShellDriver:
          keyfile: "~/.ssh/id_rsa.pub"
      - OpenWrtUciDriver: {}
      - OpenWrtPackageDriver: {}
      - OpenWrtLuCIDriver: {}
      - FreifunkWizardDriver:
          address: "10.248.248.145"
          password: "abc123"
          network: "Freifunk Berlin"
          hostname: "testdev10"
          nickname: "testlabuser"
          realname: "openwrt-testlab"
          email: "email@address"
          location: "Panoramastrasse 1A, 10178 Berlin"
          lat: "52.52081970085464"
          lon: "13.409418231737128"
          alt: "368"
          sharedInternet: True
          bw_down: "60"
          bw_up: "20"
          stats: False
          meship_radio0: "10.248.251.144"
          meshmode_radio0: "80211s"
          meship_radio1: "10.248.251.145"
          meshmode_radio1: "80211s"
          ssid: "testdev10.berlin.freifunk.net"
          dhcp: "10.248.248.144/28"
      - SSHDriver:
          explicit_scp_mode: True
      - NetworkInterfaceDriver: {}
      - FalterStrategy: {}
paths:
  backup: !template "$BASE/backup"
images:
  # filenames including a prefix of "/srv/tftp/testdevXX/" must be 128 char or less
  target: !template $LG_IMAGE
imports:
  - ../../openwrt-testlab.py
  - ../../falter-testlab.py
