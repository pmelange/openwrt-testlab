targets:
  main:
    features:
      - falter
      - flash
      - console
      - reset
      - wifi
      - online
      - olsr
    options:
      lan_ip: '10.248.248.33'
      lan_netmask: '255.255.255.240'
      lan_vlan: 103
      connected_port: 'lan1'
      switch_ports: '0 1 2 3 4 5'
      switch_connected_port: '2'
      switch_cpuport: '0'
    resources:
      - RemotePlace:
          name: port3
    drivers:
      - GpioDigitalOutputDriver:
          name: powerdriver
          bindings:
            gpio: power # resouce name
      - GpioDigitalOutputDriver:
          name: resetdriver
          bindings:
            gpio: reset # resource name
      - DigitalOutputPowerDriver:
          bindings:
            output: powerdriver
      - DigitalOutputButtonDriver:
          delay: 7.0
          bindings:
            output: resetdriver
      - SerialDriver: {}
      - TFTPProviderDriver: {}
      - UBootInteractionBoot:
          commands:
            - boot
      - UBootInteractionFlash:
          image: "target"
          sleep: 1
          commands:
            - setenv ipaddr 192.168.0.103
            - setenv serverip 192.168.0.1
            - tftpboot $IMAGE
            - sf probe 0
            - sf erase 0x60000 0xf80000
            - sf write 0x1000000 0x60000 0xf80000
            - boot
      - OpenWrtUBootDriver:
          prompt: '=>'
          autoboot: 'Autobooting in'
          boot_secret: 'lv'
          boot_secret_nolf: True
      - OpenWrtShellDriver:
          keyfile: "~/.ssh/id_rsa.pub"
      - OpenWrtUciDriver: {}
      - OpenWrtPackageDriver: {}
      - OpenWrtLuCIDriver: {}
      - FreifunkWizardDriver:
          address: "10.248.248.33"
          password: "abc123"
          network: "Freifunk Berlin"
          hostname: "testdev03"
          nickname: "testlabuser"
          realname: "openwrt-testlab"
          email: "email@address"
          location: "Panoramastrasse 1A, 10178 Berlin"
          lat: "52.52081970085464"
          lon: "13.409418231737128"
          alt: "368"
          sharedInternet: True
          bw_down: "60"
          bw_up: "20"
          stats: False
          meship_radio0: "10.248.251.32"
          meshmode_radio0: "80211s"
          meship_radio1: "10.248.251.33"
          meshmode_radio1: "80211s"
          ssid: "testdev03.berlin.freifunk.net"
          dhcp: "10.248.248.32/28"
      - SSHDriver:
          explicit_scp_mode: True
      - NetworkInterfaceDriver: {}
      - FalterStrategy: {}
paths:
  backup: !template "$BASE/backup"
images:
  # filenames including a prefix of "/srv/tftp/testdevXX/" must be 128 char or less
  target: !template $LG_IMAGE
  factory: "firmware/freifunk-falter-1.4.0-mpc85xx-p1010-tplink_tl-wdr4900-v1-squashfs-factory.bin"
  sysupgrade: "firmware/freifunk-falter-1.4.0-mpc85xx-p1010-tplink_tl-wdr4900-v1-squashfs-sysupgrade.bin"
  restore: "backup/restore.tar.gz"
imports:
  - ../../openwrt-testlab.py
  - ../../falter-testlab.py
