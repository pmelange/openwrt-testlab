targets:
  main:
    features:
      - console
      - wifi
      - online
      - olsr
    resources:
      - RemotePlace:
          name: port3
    drivers:
      - GpioDigitalOutputDriver:
          name: powerdriver
          bindings:
            gpio: power # resouce name
      - GpioDigitalOutputDriver:
          name: resetdriver
          bindings:
            gpio: reset # resource name
      - DigitalOutputPowerDriver:
          bindings:
            output: powerdriver
      - DigitalOutputButtonDriver:
          delay: 7.0
          bindings:
            output: resetdriver
      - SerialDriver: {}
      - TFTPProviderDriver: {}
      - UBootInteractionBoot:
          commands:
            - boot
      - UBootInteractionFlash:
          image: "factory"
          sleep: 1
          commands:
            - setenv ipaddr 192.168.0.103
            - setenv serverip 192.168.0.1
            - tftpboot $IMAGE
            - sf probe 0
            - sf erase 0x60000 0xf80000
            - sf write 0x1000000 0x60000 0xf80000
            - boot
      - UBootInteractionTftpboot:
          image: "factory"
          sleep: 1
          commands:
            - setenv ipaddr 192.168.0.103
            - setenv serverip 192.168.0.1
            - tftpboot $IMAGE
            - sf probe 0
            - sf erase 0x60000 0xf80000
            - sf write 0x1000000 0x60000 0xf80000
            - boot
      - UBootInteractionBootp:
          image: "factory"
          sleep: 1
          mac: "00:04:9f:ef:01:01"
          bootpip: "192.168.0.103"
          commands:
            - bootp
            - sf probe 0
            - sf erase 0x60000 0xf80000
            - sf write 0x1000000 0x60000 0xf80000
            - boot
      - OpenWrtUBootDriver:
          prompt: '=>'
          boot_expression: 'Autobooting in'
          boot_secret: 'lv'
          boot_secret_nolf: True
      - OpenWrtShellDriver:
          keyfile: "~/.ssh/id_rsa.pub"
      - OpenWrtUciDriver:
          config:
            - set:
                system:
                  "@system[0]":
                    hostname: "testdev03"
                network:
                  lan:
                    ipaddr: '192.168.103.1'
                  wan:
                    device: "lan1"
                  wan6:
                    device: "lan1"
            - del_list:
                network:
                  "@device[0]":
                    ports: 'lan1'
            - add_list:
                network:
                  "@device[0]":
                    ports: ['lan1.103', 'wan']
      - OpenWrtLuCIDriver: {}
      - SSHDriver:
          explicit_scp_mode: True
      - NetworkInterfaceDriver: {}
      - OpenWrtStrategy: {}
paths:
  backup: !template "$BASE/backup"
images:
  # filenames including a prefix of "/srv/tftp/testdevXX" must be 128 char or less
  factory: "firmware/openwrt-24.10.2-mpc85xx-p1010-tplink_tl-wdr4900-v1-squashfs-factory.bin"
  sysupgrade: "firmware/openwrt-24.10.2-mpc85xx-p1010-tplink_tl-wdr4900-v1-squashfs-sysupgrade.bin"
  restore: "backup/restore.tar.gz"
imports:
  - ../../openwrt-testlab.py
