targets:
  main:
    features:
      - console
      - wifi
      - online
    resources:
      - RemotePlace:
          name: port2
    drivers:
      - GpioDigitalOutputDriver:
          name: powerdriver
          bindings:
            gpio: power # resouce name
      - GpioDigitalOutputDriver:
          name: resetdriver
          bindings:
            gpio: reset # resource name
      - DigitalOutputPowerDriver:
          bindings:
            output: powerdriver
      - DigitalOutputButtonDriver:
          bindings:
            output: resetdriver
      - SerialDriver: {}
      - ShellDriver:
          prompt: 'root@[\w()]+:[^ ]+ '
          login_prompt: Please press Enter to activate this console.
          await_login_timeout: 30
          login_timeout: 120
          post_login_settle_time: 5
          username: root
      - OpenwrtUciDriver:
          config:
            - set:
                network:
                  wan:
                    device: 'ethernet'
                  wan6:
                    device: 'ethernet'
                  lan:
                    ipaddr: '192.168.102.1'
                system:
                  "@system[0]":
                    hostname: 'testdev02'
            - del_list:
                network:
                  "@device[0]": # br-lan
                    ports: 'ethernet'
            - add_list:
                network:
                  "@device[0]":
                    ports: 'ethernet.102'
      - CovrSmallUBootDriver:
          prompt: '=>'
          autoboot: 'stop autoboot'
          boot_expression: 'stop autoboot'
          boot_secret: 'a'
          boot_secret_nolf: True
          interrupt: 'a'
          init_commands: 
            - printenv
            - setenv ipaddr 192.168.0.2 
            - setenv serverip 192.168.0.1 
            - tftpboot openwrt-24.10.0-ramips-mt7621-dlink_covr-x1860-a1-initramfs-kernel.bin
          boot_command: bootm
      - CovrUBootStrategy: {}
imports:
  - ../../openwrt-testlab.py
