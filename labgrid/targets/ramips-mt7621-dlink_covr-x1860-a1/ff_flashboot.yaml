targets:
  main:
    features:
      - console
      - wifi
      - online
    resources:
      - RemotePlace:
          name: port2
    drivers:
      - GpioDigitalOutputDriver:
          name: powerdriver
          bindings:
            gpio: power # resouce name
      - GpioDigitalOutputDriver:
          name: resetdriver
          bindings:
            gpio: reset # resource name
      - DigitalOutputPowerDriver:
          bindings:
            output: powerdriver
      - DigitalOutputButtonDriver:
          bindings:
            output: resetdriver
      - SerialDriver: {}
      - ShellDriver:
          prompt: 'root@[-\w()]+:[^ ]+ '
          login_prompt: Please press Enter to activate this console.
          await_login_timeout: 30
          login_timeout: 120
          post_login_settle_time: 5
          username: root
      - OpenwrtUciDriver:
          config:
            - set:
                network:
                  lan:
                    ipaddr: '192.168.102.1'
            - del_list:
                network:
                  "@device[0]":
                    ports: 'ethernet'
                  "@device[3]":
                    ports: 'internet'
            - add_list:
                network:
                  "@device[0]":
                    ports: ['ethernet.102', 'internet']
                  "@device[3]":
                    ports: 'ethernet'
      - OpenwrtLuCIDriver: {}
      - FreifunkWizardDriver:
          address: "192.168.102.1"
          password: "abc123"
          network: "Freifunk Berlin"
          hostname: "testdev02"
          nickname: "testlabuser"
          realname: "openwrt-testlab"
          email: "email@address"
          location: "Panoramastrasse 1A, 10178 Berlin"
          lat: "52.52081970085464"
          lon: "13.409418231737128"
          alt: "368"
          sharedInternet: True
          bw_down: "60"
          bw_up: "20"
          stats: True
          meship_radio0: "10.0.102.1"
          meshmode_radio0: "adhoc"
          meship_radio1: "10.0.102.2"
          meshmode_radio1: "adhoc"
          ssid: "testdev02.berlin.freifunk.net"
          dhcp: "192.168.102.0/24"
      - OpenwrtFlashBootStrategy: {}
imports:
  - ../../openwrt-testlab.py
