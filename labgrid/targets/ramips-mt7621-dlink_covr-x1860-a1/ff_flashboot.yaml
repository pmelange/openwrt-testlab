targets:
  main:
    features:
      - console
      - wifi
      - online
      - olsr
    resources:
      - RemotePlace:
          name: port2
    drivers:
      - GpioDigitalOutputDriver:
          name: powerdriver
          bindings:
            gpio: power # resouce name
      - GpioDigitalOutputDriver:
          name: resetdriver
          bindings:
            gpio: reset # resource name
      - DigitalOutputPowerDriver:
          bindings:
            output: powerdriver
      - DigitalOutputButtonDriver:
          delay: 7.0
          bindings:
            output: resetdriver
      - SerialDriver: {}
      - CovrSmallUBootDriver:
          prompt: '=>'
          boot_expression: 'stop autoboot'
          boot_secret: 'a'
          boot_secret_nolf: True
          #boot_commands:
          #  - boot
          #tftpboot_commands:
          #  - printenv
          #  - setenv ipaddr 192.168.0.2
          #  - setenv serverip 192.168.0.1
          #  - tftpboot openwrt-24.10.0-ramips-mt7621-dlink_covr-x1860-a1-initramfs-kernel.bin
          #bootp_commands: 
          #  - bootp
      - OpenWrtShellDriver:
          keyfile: "~/.ssh/id_rsa.pub"
      - OpenWrtUciDriver:
          config:
            - set:
                network:
                  lan:
                    ipaddr: '10.36.198.225'
                    netmask: '255.255.255.240'
            - del_list:
                network:
                  "@device[0]":
                    ports: 'ethernet'
                  "@device[3]":
                    ports: 'internet'
            - add_list:
                network:
                  "@device[0]":
                    ports: ['ethernet.102', 'internet']
                  "@device[3]":
                    ports: 'ethernet'
      - OpenWrtLuCIDriver: {}
      - FreifunkWizardDriver:
          address: "10.36.198.225"
          password: "abc123"
          network: "Freifunk Berlin"
          hostname: "testdev02"
          nickname: "testlabuser"
          realname: "openwrt-testlab"
          email: "email@address"
          location: "Panoramastrasse 1A, 10178 Berlin"
          lat: "52.52081970085464"
          lon: "13.409418231737128"
          alt: "368"
          sharedInternet: True
          bw_down: "60"
          bw_up: "20"
          stats: False
          meship_radio0: "10.31.38.181"
          meshmode_radio0: "80211a"
          meship_radio1: "10.31.38.182"
          meshmode_radio1: "80211s"
          ssid: "testdev02.berlin.freifunk.net"
          dhcp: "10.36.198.224/28"
      - SSHDriver:
          explicit_scp_mode: True
      - NetworkInterfaceDriver: {}
      - OpenWrtFlashBootStrategy: {}
paths:
  backup: "/tmp"
images:
  firmware: "~/firmware/openwrt-23.05-snapshot-r24145-db554fd450-freifunk-falter-1.4.0-ramips-mt7621-dlink_covr-x1860-a1-squashfs-sysupgrade.bin"
  backup: "~/backup/dlink-covr.tar.gz"
imports:
  - ../../openwrt-testlab.py
