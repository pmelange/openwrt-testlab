targets:
  main:
    features:
      - ramboot
      - console
      - reset
      - wifi
      - online
    options:
      hostname: 'testdev05'
      lan_ip: '10.248.248.65'
      lan_netmask: '255.255.255.240'
      lan_vlan: 105
      connected_port: 'ethernet'
    resources:
      - RemotePlace:
          name: port5
    drivers:
      - GpioDigitalOutputDriver:
          name: powerdriver
          bindings:
            gpio: power # resouce name
      - GpioDigitalOutputDriver:
          name: resetdriver
          bindings:
            gpio: reset # resource name
      - DigitalOutputPowerDriver:
          bindings:
            output: powerdriver
      - DigitalOutputButtonDriver:
          delay: 7.0
          bindings:
            output: resetdriver
      - SerialDriver: {}
      - TFTPProviderDriver: {}
      - UBootInteractionBoot:
          commands:
            - boot
      - UBootInteractionRamboot:
          image: "target"
          commands:
            - setenv ipaddr 192.168.0.105
            - setenv serverip 192.168.0.1
            - tftpboot $IMAGE
            - bootm
      - OpenWrtUBootDriver:
          prompt: '=>'
          autoboot: 'stop autoboot'
          boot_secret: 'a'
          boot_secret_nolf: True
      - OpenWrtShellDriver:
          keyfile: "~/.ssh/id_rsa.pub"
      - OpenWrtUciDriver: {}
      - OpenWrtPackageDriver: {}
      - OpenWrtLuCIDriver: {}
      - SSHDriver:
          explicit_scp_mode: True
      - NetworkInterfaceDriver: {}
      - OpenWrtStrategy: {}
paths:
  backup: !template "$BASE/backup"
images:
  # filenames including a prefix of "/srv/tftp/testdevXX" must be 128 char or less
  target: !template $LG_IMAGE
imports:
  - ../../openwrt-testlab.py
