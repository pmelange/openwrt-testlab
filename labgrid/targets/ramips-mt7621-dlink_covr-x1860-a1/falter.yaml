targets:
  main:
    features:
      - console
      - wifi
      - online
      - olsr
    resources:
      - RemotePlace:
          name: port5
    drivers:
      - GpioDigitalOutputDriver:
          name: powerdriver
          bindings:
            gpio: power # resouce name
      - GpioDigitalOutputDriver:
          name: resetdriver
          bindings:
            gpio: reset # resource name
      - DigitalOutputPowerDriver:
          bindings:
            output: powerdriver
      - DigitalOutputButtonDriver:
          delay: 7.0
          bindings:
            output: resetdriver
      - SerialDriver: {}
      - TFTPProviderDriver: {}
      - UBootInteractionBoot:
          commands:
            - boot
      - UBootInteractionFlash:
          image: "recovery"
          commands:
            - setenv ipaddr 192.168.0.105
            - setenv serverip 192.168.0.1
            - tftpboot $IMAGE
            - nand erase 0x1c0000 0xec0000
            - nand write 0x80010000 0x1c0000 0xec0000
            - boot
      - UBootInteractionTftpboot:
          image: "initramfs"
          commands:
            - setenv ipaddr 192.168.0.105
            - setenv serverip 192.168.0.1
            - tftpboot $IMAGE
            - bootm
      - UBootInteractionBootp:
          image: "initramfs"
          mac: "a2:db:82:64:59:fd"
          bootpip: "192.168.0.105"
          commands:
            - bootp
            - bootm
      - OpenWrtUBootDriver:
          prompt: '=>'
          boot_expression: 'stop autoboot'
          boot_secret: 'a'
          boot_secret_nolf: True
      - OpenWrtShellDriver:
          keyfile: "~/.ssh/id_rsa.pub"
      - OpenWrtUciDriver:
          config:
            - set:
                network:
                  lan:
                    ipaddr: '10.36.248.65'
                    netmask: '255.255.255.240'
            - del_list:
                network:
                  "@device[0]":
                    ports: 'ethernet'
                  "@device[3]":
                    ports: 'internet'
            - add_list:
                network:
                  "@device[0]":
                    ports: ['ethernet.105', 'internet']
                  "@device[3]":
                    ports: 'ethernet'
      - OpenWrtLuCIDriver: {}
      - FreifunkWizardDriver:
          address: "10.36.248.65"
          password: "abc123"
          network: "Freifunk Berlin"
          hostname: "testdev05"
          nickname: "testlabuser"
          realname: "openwrt-testlab"
          email: "email@address"
          location: "Panoramastrasse 1A, 10178 Berlin"
          lat: "52.52081970085464"
          lon: "13.409418231737128"
          alt: "368"
          sharedInternet: True
          bw_down: "60"
          bw_up: "20"
          stats: False
          meship_radio0: "10.36.251.64"
          meshmode_radio0: "80211a"
          meship_radio1: "10.36.251.65"
          meshmode_radio1: "80211s"
          ssid: "testdev05.berlin.freifunk.net"
          dhcp: "10.36.248.64/28"
      - SSHDriver:
          explicit_scp_mode: True
      - NetworkInterfaceDriver: {}
      - FreifunkStrategy: {}
paths:
  backup: !template "$BASE/backup"
images:
  # filenames including a prefix of "/srv/tftp/testdevXX/" must be 128 char or less
  factory: "firmware/freifunk-falter-1.4.0-ramips-mt7621-dlink_covr-x1860-a1-squashfs-factory.bin"
  initramfs: "firmware/openwrt-24.10.0-ramips-mt7621-dlink_covr-x1860-a1-initramfs-kernel.bin"
  recovery: "firmware/freifunk-falter-1.4.0-ramips-mt7621-dlink_covr-x1860-a1-squashfs-recovery.bin"
  sysupgrade: "firmware/freifunk-falter-1.4.0-ramips-mt7621-dlink_covr-x1860-a1-squashfs-sysupgrade.bin"
  restore: "backup/restore.tar.gz"
imports:
  - ../../openwrt-testlab.py
  - ../../freifunk-testlab.py
