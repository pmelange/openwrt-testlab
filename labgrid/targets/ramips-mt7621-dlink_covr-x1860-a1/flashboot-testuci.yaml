targets:
  main:
    features:
      - console
      - wifi
      - online
    resources:
      - RemotePlace:
          name: port2
    drivers:
      - GpioDigitalOutputDriver:
          name: powerdriver
          bindings:
            gpio: power # resouce name
      - GpioDigitalOutputDriver:
          name: resetdriver
          bindings:
            gpio: reset # resource name
      - DigitalOutputPowerDriver:
          bindings:
            output: powerdriver
      - DigitalOutputButtonDriver:
          bindings:
            output: resetdriver
      - SerialDriver: {}
      - ShellDriver:
          prompt: 'root@[\w()]+:[^ ]+ '
          login_prompt: Please press Enter to activate this console.
          await_login_timeout: 15
          login_timeout: 120
          post_login_settle_time: 5
          username: root
      - OpenwrtUciDriver:
          config:
            - del_list:
                network:
                  "@device[0]":
                    ports: 'ethernet'
                  "@device[3]":
                    ports: 'internet'
            - add_list:
                network:
                  "@device[0]":
                    ports: 'ethernet.102'
                  "@device[3]":
                    ports: 'ethernet'
            - add:
                test: 'addedsection'
            - add:
                test:
                  - 'addedlist1'
                  - 'addedlist2'
            - set:
                test:
                  secondsection: 'withaname'
                  withaname:
                    option1: 'onenew'
                    option2: 'twonew'
            - set:
                test:
                  withaname:
                    newoption: 'bar'
            - add_list:
                test:
                  sectionX:
                    loption2: 'd'
            - del_list:
                test:
                  sectionX:
                    loption1: 'f'
            - delete:
                test: 'deletethissection'
            - delete:
                test:
                  sectionX: 'deletethisoption'
            - delete:
                test:
                  sectionX:
                    loption1:
                      - 1
                      - 2
            - delete:
                test: 
                  sectionX:
                    loption2: 0
      - CovrFlashBootStrategy: {}
imports:
  - ../../openwrt-testlab.py
